name: mollynvr

services:
  mollynvr:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mollynvr:dev
    container_name: mollynvr
    # Bridge network with published ports. Reason: host networking in Docker Desktop on Windows
    # does not forward UDP into the container, and WebRTC media (SRTP) runs over UDP :8555.
    # Multicast discovery (WS-Discovery/SADP) is unavailable in bridge mode — subnet scanning is used
    # (see docs/architecture.md section 15, risk 1).
    ports:
      - "9080:9080"       # UI/API/WHEP (HTTP)
      - "9443:9443"       # UI/API/WHEP (HTTPS, PWA)
      - "8555:8555"       # WebRTC (ICE-TCP)
      - "8555:8555/udp"   # WebRTC (SRTP media)
    # NVENC/NVDEC for transcoding (requires a GPU-capable Docker Desktop and the NVIDIA driver).
    gpus: all
    environment:
      # Full set of NVIDIA driver libraries (otherwise libnvidia-encode.so for NVENC is missing).
      NVIDIA_DRIVER_CAPABILITIES: all
      # HTTP for debugging and the local network, HTTPS for installing the PWA on a phone.
      Kestrel__Endpoints__Https__Url: https://0.0.0.0:9443
      Kestrel__Endpoints__Https__Certificate__Path: /certs/mollynvr.pem
      Kestrel__Endpoints__Https__Certificate__KeyPath: /certs/mollynvr-key.pem
      # LAN address of the Windows host for the WebRTC ICE candidate: it is not visible from the container.
      # Set HOST_LAN_IP in .env (see .env.example).
      Go2Rtc__WebRtcCandidates__0: ${HOST_LAN_IP:-192.168.1.151}:8555
      # Default discovery range (multicast WS-Discovery/SADP is unavailable in bridge mode).
      Discovery__DefaultRange: ${DISCOVERY_RANGE:-192.168.1.0/24}
      # Reolink bridge (Baichuan, port 9000): HTTP API and RTSP inside the compose network.
      Reolink__ApiBaseUrl: http://reolink:8655
      Reolink__RtspBaseUrl: rtsp://reolink:8654
      # Time zone: recording schedules and file names use the server local time.
      TZ: ${TZ:-Europe/Moscow}
      # Video recording: a separate volume and the segment length.
      Recording__StoragePath: /recordings
      Recording__SegmentSeconds: ${RECORDING_SEGMENT_SECONDS:-300}
    volumes:
      - ./data:/data
      - ./recordings:/recordings
      - ./certs:/certs:ro
    depends_on:
      - reolink
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET /api/health HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\":\"ok\"'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Reolink bridge: cameras without HTTP/ONVIF (Baichuan only, port 9000).
  # The application writes the camera list to ./data/reolink/config.json; the bridge
  # restarts when the file changes (see docker/reolink/entrypoint.sh).
  reolink:
    build:
      context: .
      dockerfile: docker/reolink/Dockerfile
    image: mollynvr-reolink:dev
    container_name: mollynvr-reolink
    volumes:
      - ./data/reolink:/config
    environment:
      TZ: ${TZ:-Europe/Moscow}
    restart: unless-stopped
